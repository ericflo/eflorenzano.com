name: Publish container image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The config lives inside the Dockerfile, so a typo in it builds clean and
      # only fails when the container starts. Boot it once before publishing.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoketest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --rm --name smoketest \
            --read-only --tmpfs /tmp -p 8080:8080 \
            smoketest:${{ github.sha }}

          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            if [ "$i" = "20" ]; then
              echo "::error::container never became ready"
              docker logs smoketest || true
              exit 1
            fi
            sleep 1
          done

          fail=0
          for path in / /index.html /favicon.ico /media/css/global.css \
                      /media/fonts/Overpass-Black.woff2 /media/images/me.jpg; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$code  $path"
            [ "$code" = "200" ] || fail=1
          done

          # Unknown paths must 404 rather than fall back to index.html.
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)
          echo "$code  /does-not-exist (expect 404)"
          [ "$code" = "404" ] || fail=1

          # Runs unprivileged.
          uid=$(docker exec smoketest id -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ] || fail=1

          docker rm -f smoketest >/dev/null 2>&1 || true
          exit $fail

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
